<!DOCTYPE html>
<html>
<head>
    <title>Linear Regression - CM23012</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-vis"></script>
</head>
<body>
    <h1>Linear Regression with Synthetic Data</h1>
    <p>Check the "Visor" on the right to see the training graph!</p>

    <script>
        async function run() {
            // 1. Generate Synthetic Data (y = 2x - 1)
            const xs = tf.tensor2d([-1, 0, 1, 2, 3, 4], [6, 1]);
            const ys = tf.tensor2d([-3, -1, 1, 3, 5, 7], [6, 1]);

            // 2. Create a Sequential Model
            const model = tf.sequential();
            model.add(tf.layers.dense({units: 1, inputShape: [1]}));

            // 3. Prepare for training (Loss and Optimizer)
            model.compile({loss: 'meanSquaredError', optimizer: 'sgd'});

            // 4. Train the model with Graph visualization
            await model.fit(xs, ys, {
                epochs: 100,
                callbacks: tfvis.show.fitCallbacks(
                    { name: 'Training Performance' },
                    ['loss'],
                    { height: 200, callbacks: ['onEpochEnd'] }
                )
            });

            // 5. Use the model to predict
            alert("Prediction for x=10: " + model.predict(tf.tensor2d([10], [1, 1])).dataSync());
        }
        run();
    </script>
</body>
</html>

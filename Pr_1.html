<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TF.js Linear Regression</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
</head>
<body>
    <h1>TensorFlow.js Linear Regression</h1>
    <p>Open <strong>Console (F12)</strong> to test predictions.</p>

    <script>
        async function run() {

            // Synthetic data: y = 2x + 1
            const xs = tf.tensor2d([1, 2, 3, 4], [4, 1]);
            const ys = tf.tensor2d([3, 5, 7, 9], [4, 1]);

            // Make model GLOBAL so console can access it
            window.model = tf.sequential();
            model.add(tf.layers.dense({ units: 1, inputShape: [1] }));

            model.compile({
                optimizer: 'sgd',
                loss: 'meanSquaredError'
            });

            await model.fit(xs, ys, { epochs: 500 });

            console.log("Model trained ✅");
            console.log("Now test in console using:");
            console.log("model.predict(tf.tensor2d([8],[1,1])).print();");
        }

        run();
    </script>
</body>
</html>

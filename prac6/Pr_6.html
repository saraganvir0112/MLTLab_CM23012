<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PoseNet — Body Pose Detection</title>

  <!-- TensorFlow.js + PoseNet -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/posenet@2.2.2/dist/posenet.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&display=swap');

    :root {
      --bg: #050a0e;
      --panel: #0b1520;
      --border: #0ff3;
      --accent: #00fff7;
      --accent2: #ff2d78;
      --text: #c8fff8;
      --dim: #4a7a74;
      --green: #00ff88;
      --yellow: #ffe600;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Grid scan-line overlay */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,255,247,.018) 2px,
        rgba(0,255,247,.018) 4px
      );
      pointer-events: none;
      z-index: 999;
    }

    header {
      width: 100%;
      max-width: 960px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.2rem;
      letter-spacing: 4px;
      color: var(--accent);
      text-shadow: 0 0 20px var(--accent), 0 0 60px #00fff740;
    }
    .logo span { color: var(--accent2); }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 2px;
      font-size: .75rem;
      letter-spacing: 1px;
      background: #0b1520;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--dim);
      transition: background .3s, box-shadow .3s;
    }
    .dot.live { background: var(--green); box-shadow: 0 0 10px var(--green); }
    .dot.loading { background: var(--yellow); animation: blink .7s infinite; }

    @keyframes blink { 50% { opacity: 0; } }

    /* ── Main layout ─────────────────────────────── */
    .main {
      display: flex;
      gap: 20px;
      width: 100%;
      max-width: 960px;
      align-items: flex-start;
    }

    /* ── Canvas wrapper ──────────────────────────── */
    .canvas-wrap {
      position: relative;
      flex: 1;
      border: 1px solid var(--border);
      background: #000;
      overflow: hidden;
    }

    .canvas-wrap::before {
      content: 'LIVE FEED';
      position: absolute;
      top: 10px; left: 10px;
      font-size: .65rem;
      letter-spacing: 3px;
      color: var(--accent2);
      z-index: 10;
    }

    .corner {
      position: absolute;
      width: 14px; height: 14px;
      border-color: var(--accent);
      border-style: solid;
      z-index: 10;
    }
    .corner.tl { top: 6px; left: 6px; border-width: 2px 0 0 2px; }
    .corner.tr { top: 6px; right: 6px; border-width: 2px 2px 0 0; }
    .corner.bl { bottom: 6px; left: 6px; border-width: 0 0 2px 2px; }
    .corner.br { bottom: 6px; right: 6px; border-width: 0 2px 2px 0; }

    #videoEl {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0;           /* hidden — canvas shows everything */
      transform: scaleX(-1);
    }

    #poseCanvas {
      display: block;
      width: 100%;
      transform: scaleX(-1);
    }

    .overlay-msg {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(5,10,14,.85);
      z-index: 20;
      font-size: .85rem;
      letter-spacing: 2px;
      color: var(--dim);
      text-align: center;
      padding: 20px;
    }
    .overlay-msg.hidden { display: none; }
    .spinner {
      width: 36px; height: 36px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Side panel ──────────────────────────────── */
    .panel {
      width: 220px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex-shrink: 0;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 14px;
    }
    .card-title {
      font-size: .65rem;
      letter-spacing: 3px;
      color: var(--accent);
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    /* Confidence bar */
    .conf-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: .7rem;
    }
    .conf-label { color: var(--dim); min-width: 80px; }
    .conf-bar-bg {
      flex: 1; height: 4px;
      background: #0ff1;
      margin: 0 8px;
      position: relative;
    }
    .conf-bar {
      height: 100%;
      background: var(--accent);
      transition: width .2s;
      box-shadow: 0 0 6px var(--accent);
    }
    .conf-val { min-width: 32px; text-align: right; color: var(--text); }

    /* Stat numbers */
    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: .72rem;
      padding: 4px 0;
      border-bottom: 1px solid #0ff1;
    }
    .stat-row:last-child { border: none; }
    .stat-key { color: var(--dim); }
    .stat-val { color: var(--green); }

    /* Controls */
    .btn {
      width: 100%;
      padding: 10px;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: 'Share Tech Mono', monospace;
      font-size: .75rem;
      letter-spacing: 2px;
      cursor: pointer;
      text-transform: uppercase;
      transition: background .2s, color .2s, box-shadow .2s;
    }
    .btn:hover {
      background: var(--accent);
      color: var(--bg);
      box-shadow: 0 0 20px var(--accent);
    }
    .btn:disabled { opacity: .3; cursor: not-allowed; }
    .btn.danger { border-color: var(--accent2); color: var(--accent2); }
    .btn.danger:hover { background: var(--accent2); color: #fff; box-shadow: 0 0 20px var(--accent2); }

    /* Slider */
    label.slider-label {
      display: flex;
      justify-content: space-between;
      font-size: .7rem;
      margin-bottom: 4px;
      color: var(--dim);
    }
    input[type=range] {
      width: 100%;
      accent-color: var(--accent);
      margin-bottom: 10px;
    }

    /* Keypoints list */
    #keypointList {
      max-height: 180px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--accent) transparent;
    }
    .kp-row {
      display: flex;
      justify-content: space-between;
      font-size: .65rem;
      padding: 3px 0;
      border-bottom: 1px solid #0ff1;
      color: var(--dim);
    }
    .kp-row.high { color: var(--text); }
    .kp-row .kp-name { flex: 1; }
    .kp-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--dim);
      align-self: center;
      margin-left: 6px;
    }
    .kp-dot.high { background: var(--green); box-shadow: 0 0 6px var(--green); }

    /* FPS counter */
    #fpsCounter {
      position: absolute;
      bottom: 10px; right: 10px;
      font-size: .7rem;
      letter-spacing: 2px;
      color: var(--accent2);
      z-index: 10;
      background: rgba(5,10,14,.6);
      padding: 2px 6px;
    }

    footer {
      margin-top: 24px;
      font-size: .65rem;
      letter-spacing: 2px;
      color: var(--dim);
      text-align: center;
    }

    @media (max-width: 700px) {
      .main { flex-direction: column; }
      .panel { width: 100%; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">POSE<span>NET</span></div>
  <div class="status-pill">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">INITIALIZING</span>
  </div>
</header>

<div class="main">

  <!-- ── Canvas area ── -->
  <div class="canvas-wrap" id="canvasWrap">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <video id="videoEl" autoplay muted playsinline></video>
    <canvas id="poseCanvas"></canvas>
    <div id="fpsCounter">-- FPS</div>

    <div class="overlay-msg" id="overlayMsg">
      <div class="spinner"></div>
      <span id="overlayText">LOADING TENSORFLOW.JS MODEL…</span>
    </div>
  </div>

  <!-- ── Side panel ── -->
  <div class="panel">

    <!-- Controls -->
    <div class="card">
      <div class="card-title">Controls</div>
      <button class="btn" id="startBtn" disabled>▶ Start Camera</button>
      <br><br>
      <button class="btn danger" id="stopBtn" disabled>■ Stop</button>
      <br><br>
      <label class="slider-label">
        <span>Min Confidence</span>
        <span id="confVal">0.5</span>
      </label>
      <input type="range" id="confSlider" min="0.1" max="0.9" step="0.05" value="0.5">
      <label class="slider-label">
        <span>Point Size</span>
        <span id="sizeVal">5</span>
      </label>
      <input type="range" id="sizeSlider" min="2" max="12" step="1" value="5">
    </div>

    <!-- Stats -->
    <div class="card">
      <div class="card-title">Detection Stats</div>
      <div class="stat-row"><span class="stat-key">Model</span><span class="stat-val" id="statModel">—</span></div>
      <div class="stat-row"><span class="stat-key">Poses</span><span class="stat-val" id="statPoses">0</span></div>
      <div class="stat-row"><span class="stat-key">Keypoints</span><span class="stat-val" id="statKp">0/17</span></div>
      <div class="stat-row"><span class="stat-key">Score</span><span class="stat-val" id="statScore">—</span></div>
    </div>

    <!-- Per-keypoint confidence -->
    <div class="card">
      <div class="card-title">Keypoint Confidence</div>
      <div id="keypointList"></div>
    </div>

  </div>
</div>

<footer>TENSORFLOW.JS · POSENET · BODY POSE DETECTION · 17 KEYPOINTS</footer>

<script>
/* ═══════════════════════════════════════════════
   PoseNet Live Pose Detection
═══════════════════════════════════════════════ */

const video        = document.getElementById('videoEl');
const canvas       = document.getElementById('poseCanvas');
const ctx          = canvas.getContext('2d');
const overlayMsg   = document.getElementById('overlayMsg');
const overlayText  = document.getElementById('overlayText');
const statusDot    = document.getElementById('statusDot');
const statusText   = document.getElementById('statusText');
const startBtn     = document.getElementById('startBtn');
const stopBtn      = document.getElementById('stopBtn');
const confSlider   = document.getElementById('confSlider');
const sizeSlider   = document.getElementById('sizeSlider');
const fpsCounter   = document.getElementById('fpsCounter');

let net, stream, animId;
let minConf   = 0.5;
let ptSize    = 5;
let lastTime  = performance.now();
let frameCount = 0, fps = 0;

// ── Skeleton adjacency ────────────────────────
const CONNECTED_PAIRS = [
  ['leftEar','leftEye'],['leftEye','nose'],['nose','rightEye'],['rightEye','rightEar'],
  ['leftShoulder','rightShoulder'],
  ['leftShoulder','leftElbow'],['leftElbow','leftWrist'],
  ['rightShoulder','rightElbow'],['rightElbow','rightWrist'],
  ['leftShoulder','leftHip'],['rightShoulder','rightHip'],
  ['leftHip','rightHip'],
  ['leftHip','leftKnee'],['leftKnee','leftAnkle'],
  ['rightHip','rightKnee'],['rightKnee','rightAnkle'],
];

// ── Keypoint display names ─────────────────────
const KP_NAMES = [
  'nose','leftEye','rightEye','leftEar','rightEar',
  'leftShoulder','rightShoulder','leftElbow','rightElbow',
  'leftWrist','rightWrist','leftHip','rightHip',
  'leftKnee','rightKnee','leftAnkle','rightAnkle'
];

// ── Status helpers ────────────────────────────
function setStatus(state, msg) {
  statusText.textContent = msg;
  statusDot.className = 'dot ' + state;
}

// ── Load model ────────────────────────────────
async function loadModel() {
  setStatus('loading', 'LOADING MODEL');
  overlayText.textContent = 'LOADING TENSORFLOW.JS MODEL…';

  net = await posenet.load({
    architecture: 'MobileNetV1',
    outputStride: 16,
    inputResolution: { width: 640, height: 480 },
    multiplier: 0.75
  });

  document.getElementById('statModel').textContent = 'MobileNetV1';
  setStatus('', 'MODEL READY');
  overlayText.textContent = 'MODEL LOADED — CLICK "START CAMERA"';

  // Remove spinner, show static msg
  overlayMsg.querySelector('.spinner').remove();

  startBtn.disabled = false;
}

// ── Camera start/stop ─────────────────────────
startBtn.addEventListener('click', async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480, facingMode: 'user' },
      audio: false
    });
    video.srcObject = stream;
    await video.play();

    canvas.width  = video.videoWidth  || 640;
    canvas.height = video.videoHeight || 480;

    overlayMsg.classList.add('hidden');
    setStatus('live', 'LIVE');
    startBtn.disabled = true;
    stopBtn.disabled  = false;

    detectLoop();
  } catch (e) {
    overlayText.textContent = 'CAMERA ACCESS DENIED OR UNAVAILABLE';
    setStatus('', 'ERROR');
    console.error(e);
  }
});

stopBtn.addEventListener('click', () => {
  cancelAnimationFrame(animId);
  if (stream) stream.getTracks().forEach(t => t.stop());
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  overlayMsg.classList.remove('hidden');
  overlayText.textContent = 'CAMERA STOPPED — CLICK "START CAMERA" TO RESUME';
  setStatus('', 'STOPPED');
  startBtn.disabled = false;
  stopBtn.disabled  = true;
});

// ── Sliders ────────────────────────────────────
confSlider.addEventListener('input', () => {
  minConf = +confSlider.value;
  document.getElementById('confVal').textContent = minConf.toFixed(2);
});
sizeSlider.addEventListener('input', () => {
  ptSize = +sizeSlider.value;
  document.getElementById('sizeVal').textContent = ptSize;
});

// ── Detection loop ─────────────────────────────
async function detectLoop() {
  if (video.readyState < 2) { animId = requestAnimationFrame(detectLoop); return; }

  const pose = await net.estimateSinglePose(video, {
    flipHorizontal: false
  });

  // FPS
  frameCount++;
  const now = performance.now();
  if (now - lastTime >= 1000) {
    fps = frameCount;
    frameCount = 0;
    lastTime = now;
    fpsCounter.textContent = fps + ' FPS';
  }

  drawScene(pose);
  updateStats(pose);
  animId = requestAnimationFrame(detectLoop);
}

// ── Draw ───────────────────────────────────────
function drawScene(pose) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Mirror video onto canvas
  ctx.save();
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  ctx.restore();

  // Dark tint for style
  ctx.fillStyle = 'rgba(5,10,14,0.45)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawSkeleton(pose);
  drawKeypoints(pose);
}

function drawSkeleton(pose) {
  const kpMap = {};
  pose.keypoints.forEach(kp => { kpMap[kp.part] = kp; });

  CONNECTED_PAIRS.forEach(([a, b]) => {
    const kpA = kpMap[a], kpB = kpMap[b];
    if (!kpA || !kpB) return;
    if (kpA.score < minConf || kpB.score < minConf) return;

    const avg = (kpA.score + kpB.score) / 2;

    ctx.beginPath();
    ctx.moveTo(kpA.position.x, kpA.position.y);
    ctx.lineTo(kpB.position.x, kpB.position.y);

    // Gradient line
    const grad = ctx.createLinearGradient(
      kpA.position.x, kpA.position.y,
      kpB.position.x, kpB.position.y
    );
    grad.addColorStop(0, `rgba(0,255,247,${avg})`);
    grad.addColorStop(1, `rgba(255,45,120,${avg})`);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2.5;
    ctx.shadowBlur = 12;
    ctx.shadowColor = '#00fff7';
    ctx.stroke();
    ctx.shadowBlur = 0;
  });
}

function drawKeypoints(pose) {
  pose.keypoints.forEach(kp => {
    if (kp.score < minConf) return;

    const { x, y } = kp.position;
    const r = ptSize;

    // Outer glow ring
    ctx.beginPath();
    ctx.arc(x, y, r + 4, 0, 2 * Math.PI);
    ctx.strokeStyle = `rgba(0,255,247,${kp.score * 0.4})`;
    ctx.lineWidth = 1;
    ctx.stroke();

    // Filled dot
    ctx.beginPath();
    ctx.arc(x, y, r, 0, 2 * Math.PI);
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(1, '#00fff7');
    ctx.fillStyle = g;
    ctx.shadowBlur = 16;
    ctx.shadowColor = '#00fff7';
    ctx.fill();
    ctx.shadowBlur = 0;
  });
}

// ── UI stats ───────────────────────────────────
function updateStats(pose) {
  const visible = pose.keypoints.filter(k => k.score >= minConf);
  const avgScore = visible.length
    ? (visible.reduce((s, k) => s + k.score, 0) / visible.length)
    : 0;

  document.getElementById('statPoses').textContent  = 1;
  document.getElementById('statKp').textContent     = `${visible.length}/17`;
  document.getElementById('statScore').textContent  = avgScore.toFixed(3);

  // Keypoint list
  const list = document.getElementById('keypointList');
  list.innerHTML = '';
  pose.keypoints.forEach(kp => {
    const high = kp.score >= minConf;
    const row  = document.createElement('div');
    row.className = 'kp-row' + (high ? ' high' : '');
    row.innerHTML = `
      <span class="kp-name">${kp.part}</span>
      <span>${(kp.score * 100).toFixed(0)}%</span>
      <span class="kp-dot${high ? ' high' : ''}"></span>
    `;
    list.appendChild(row);
  });
}

// ── Boot ───────────────────────────────────────
loadModel().catch(e => {
  overlayText.textContent = 'MODEL LOAD FAILED. CHECK CONSOLE.';
  setStatus('', 'ERROR');
  console.error(e);
});
</script>
</body>
</html>

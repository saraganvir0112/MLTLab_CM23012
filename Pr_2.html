<!DOCTYPE html>
<html>
<head>
  <title>MNIST CNN Practical</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 20px; line-height: 1.6; }
    #status { font-weight: bold; color: #2c3e50; padding: 10px; background: #ecf0f1; border-radius: 5px; display: inline-block; }
    .result-box { margin-top: 20px; padding: 20px; border: 2px solid #3498db; border-radius: 10px; display: inline-block; min-width: 300px; }
    .epoch-log { font-family: monospace; font-size: 12px; color: #7f8c8d; }
  </style>
</head>
<body>

  <h1>MNIST Digit Recognition (CNN)</h1>
  <p>Status: <span id="status">Initializing...</span></p>
  
  <div id="evaluation-zone" class="result-box" style="display:none;">
    <h3>Practical Evaluation</h3>
    <p id="prediction-text"></p>
    <div id="logs" class="epoch-log"></div>
  </div>

  <script type="module">
    import {MnistData} from 'https://storage.googleapis.com/tfjs-tutorials/mnist_data.js';

    // 1. Define the CNN Architecture
    function createModel() {
      const model = tf.sequential();
      
      // Convolutional Layer
      model.add(tf.layers.conv2d({
        inputShape: [28, 28, 1],
        kernelSize: 3,
        filters: 8,
        activation: 'relu'
      }));

      // Pooling Layer
      model.add(tf.layers.maxPooling2d({poolSize: [2, 2]}));

      // Flatten and Dense Layers
      model.add(tf.layers.flatten());
      model.add(tf.layers.dense({units: 32, activation: 'relu'}));
      model.add(tf.layers.dense({units: 10, activation: 'softmax'}));

      model.compile({
        optimizer: tf.train.adam(),
        loss: 'categoricalCrossentropy',
        metrics: ['accuracy']
      });

      return model;
    }

    async function train() {
      const status = document.getElementById('status');
      const logs = document.getElementById('logs');
      
      status.innerText = "Loading MNIST Data...";
      const data = new MnistData();
      await data.load();

      status.innerText = "Training CNN (5 Epochs)...";
      const model = createModel();

      // Export to window for Console Testing
      window.model = model;
      window.tf = tf;
      window.data = data;

      const TRAIN_SIZE = 5000;
      const [trainXs, trainYs] = tf.tidy(() => {
        const d = data.nextTrainBatch(TRAIN_SIZE);
        return [d.xs.reshape([TRAIN_SIZE, 28, 28, 1]), d.labels];
      });

      await model.fit(trainXs, trainYs, {
        batchSize: 128,
        epochs: 5,
        shuffle: true,
        callbacks: {
          onEpochEnd: (epoch, log) => {
            logs.innerHTML += `Epoch ${epoch}: Loss = ${log.loss.toFixed(4)}<br>`;
          }
        }
      });

      status.innerText = "Training Complete! ✅";
      document.getElementById('evaluation-zone').style.display = "block";
      
      // Run final prediction for evaluation
      evaluateModel(model, data);
    }

    function evaluateModel(model, data) {
      const testData = data.nextTestBatch(1);
      const testImage = testData.xs.reshape([1, 28, 28, 1]);
      const prediction = model.predict(testImage);
      const predictedDigit = prediction.argMax(-1).dataSync()[0];
      const actualDigit = testData.labels.argMax(-1).dataSync()[0];

      document.getElementById('prediction-text').innerHTML = 
        `Model predicted: <strong>${predictedDigit}</strong><br>` +
        `Actual digit was: <strong>${actualDigit}</strong>`;
    }

    train();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Object Detector (Bounding Boxes)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #222; color: white; }
        .wrapper { position: relative; display: inline-block; }
        video, canvas { position: absolute; left: 0; top: 0; border-radius: 8px; }
        #status { margin-bottom: 20px; color: #00ffcc; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Real-Time Object Detection</h1>
    <p id="status">Loading Model...</p>
    
    <div class="wrapper">
        <video id="webcam" autoplay playsinline muted width="640" height="480"></video>
        <canvas id="overlay" width="640" height="480"></canvas>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('overlay');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
        let model;

        async function setupWebcam() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            video.srcObject = stream;
            return new Promise(resolve => video.onloadedmetadata = resolve);
        }

        async function detectFrame() {
            // 1. Detect objects in the current video frame
            const predictions = await model.detect(video);
            
            // 2. Clear the previous drawings
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 3. Draw new bounding boxes
            predictions.forEach(prediction => {
                const [x, y, width, height] = prediction.bbox;
                
                // Draw the box
                ctx.strokeStyle = "#00FF00";
                ctx.lineWidth = 4;
                ctx.strokeRect(x, y, width, height);

                // Draw the label background
                ctx.fillStyle = "#00FF00";
                const textWidth = ctx.measureText(prediction.class).width;
                ctx.fillRect(x, y, textWidth + 10, 20);

                // Draw the text
                ctx.fillStyle = "#000000";
                ctx.fillText(
                    `${prediction.class} (${Math.round(prediction.score * 100)}%)`, 
                    x + 5, y + 15
                );
            });

            // 4. Repeat for the next frame
            requestAnimationFrame(detectFrame);
        }

        async function main() {
            model = await cocoSsd.load();
            status.innerText = "Model Loaded. Starting Webcam...";
            await setupWebcam();
            status.innerText = "Detecting...";
            detectFrame();
        }

        main();
    </script>
</body>
</html>

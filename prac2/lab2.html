<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Batch Analyzer</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
    <style>
        :root { --accent: #ff007b; --panel-bg: #1a1a1c; }
        body { background: #000; color: #eee; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 40px; }
        
        .container { max-width: 1000px; margin: auto; }
        header { border-bottom: 1px solid #333; margin-bottom: 30px; padding-bottom: 10px; }

        /* Gallery Grid */
        .image-feed { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
            gap: 15px; 
            margin-bottom: 30px; 
        }
        
        .image-card { 
            background: var(--panel-bg); 
            padding: 10px; 
            border-radius: 12px; 
            border: 1px solid #222; 
            text-align: center;
        }

        .image-card img { 
            width: 100%; 
            border-radius: 8px; 
            transition: 0.3s;
        }

        /* Result Labels */
        .result-badge { 
            background: var(--accent); 
            font-size: 0.75rem; 
            padding: 4px 10px; 
            border-radius: 20px; 
            display: inline-block; 
            margin-top: 10px;
            font-weight: bold;
        }

        .btn-run { 
            background: white; color: black; border: none; padding: 15px 40px; 
            border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn-run:hover { background: var(--accent); color: white; transform: scale(1.05); }
        .btn-run:disabled { background: #333; color: #666; cursor: not-allowed; }

        .loader { color: var(--accent); font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Batch <span style="color: var(--accent);">Recognition</span></h1>
        <p id="status" class="loader">Engine Warming Up...</p>
    </header>

    <div class="image-feed" id="gallery">
        <div class="image-card">
            <img src="https://storage.googleapis.com/tfjs-models/assets/cat.jpg" crossorigin="anonymous">
            <div class="result-area">-</div>
        </div>
        <div class="image-card">
            <img src="https://storage.googleapis.com/tfjs-models/assets/dog.jpg" crossorigin="anonymous">
            <div class="result-area">-</div>
        </div>
        <div class="image-card">
            <img src="https://images.unsplash.com/photo-1543852786-1cf6624b9987?w=200" crossorigin="anonymous">
            <div class="result-area">-</div>
        </div>
        <div class="image-card">
            <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?w=200" crossorigin="anonymous">
            <div class="result-area">-</div>
        </div>
        <div class="image-card">
            <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=200" crossorigin="anonymous">
            <div class="result-area">-</div>
        </div>
    </div>

    <button id="trigger" class="btn-run" onclick="processBatch()" disabled>Run Batch Analysis</button>
</div>

<script>
    let aiModel;

    // Load MobileNet immediately
    (async function initSystem() {
        aiModel = await mobilenet.load();
        document.getElementById('status').innerText = "AI System Online";
        document.getElementById('status').style.color = "#00ff88";
        document.getElementById('trigger').disabled = false;
    })();

    async function processBatch() {
        const cards = document.querySelectorAll('.image-card');
        const status = document.getElementById('status');
        
        status.innerText = "Analyzing Feed...";
        
        // Loop through each card
        for (let card of cards) {
            const imgElement = card.querySelector('img');
            const resultArea = card.querySelector('.result-area');
            
            // Highlight current card
            card.style.borderColor = "#ff007b";
            
            try {
                const predictions = await aiModel.classify(imgElement);
                const topMatch = predictions[0];
                
                resultArea.innerHTML = `
                    <div class="result-badge">${(topMatch.probability * 100).toFixed(0)}% Match</div>
                    <div style="margin-top:5px; font-weight:bold">${topMatch.className.split(',')[0]}</div>
                `;
            } catch (err) {
                resultArea.innerText = "Error";
            }
            
            card.style.borderColor = "#222"; // Reset color
        }
        
        status.innerText = "Batch Processed.";
    }
</script>

</body>
</html>

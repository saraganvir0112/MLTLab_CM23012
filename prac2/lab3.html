<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Vision: MobileNet vs ResNet</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/resnet"></script>
    <style>
        :root { --neon-blue: #00d2ff; --neon-purple: #9d50bb; }
        body { background: #0a0a0c; color: #e0e0e0; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px; }
        
        .upload-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 30px; text-align: center; width: 100%; max-width: 800px; backdrop-filter: blur(10px); }
        
        #preview { width: 100%; max-width: 400px; border-radius: 12px; margin: 20px 0; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; width: 100%; }
        .model-box { padding: 20px; border-radius: 15px; background: rgba(255,255,255,0.05); border-top: 3px solid var(--neon-blue); }
        .resnet-box { border-top-color: var(--neon-purple); }

        .btn-analyze { background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple)); color: white; border: none; padding: 12px 30px; border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1rem; }
        .btn-analyze:disabled { opacity: 0.4; cursor: wait; }
        
        .stats { font-size: 0.8rem; color: #888; margin-top: 10px; }
        h2 { letter-spacing: 2px; text-transform: uppercase; margin-bottom: 30px; }
    </style>
</head>
<body>

    <h2>Model Benchmark Studio</h2>

    <div class="upload-card">
        <input type="file" id="imageInput" accept="image/*" style="margin-bottom: 20px;">
        <br>
        <img id="preview" alt="Input Preview">
        <br>
        <button id="runBtn" class="btn-analyze" onclick="startAnalysis()" disabled>Loading Engines...</button>

        <div class="comparison-grid" id="resultGrid" style="display: none;">
            <div class="model-box">
                <h3 style="color: var(--neon-blue)">MobileNet V2</h3>
                <div id="m-label" style="font-size: 1.2rem; font-weight: bold;">-</div>
                <div id="m-prob" class="stats">Confidence: -</div>
                <div id="m-time" class="stats">Latency: -</div>
            </div>
            <div class="model-box resnet-box">
                <h3 style="color: var(--neon-purple)">ResNet 50</h3>
                <div id="r-label" style="font-size: 1.2rem; font-weight: bold;">-</div>
                <div id="r-prob" class="stats">Confidence: -</div>
                <div id="r-time" class="stats">Latency: -</div>
            </div>
        </div>
    </div>

<script>
    let netMobile, netResnet;

    // Load Engines
    (async function init() {
        const btn = document.getElementById('runBtn');
        try {
            [netMobile, netResnet] = await Promise.all([
                mobilenet.load(),
                resnet.load()
            ]);
            btn.innerText = "Analyze Image";
            btn.disabled = false;
        } catch (e) {
            btn.innerText = "Error Loading Models";
            console.error(e);
        }
    })();

    // Image Preview logic
    document.getElementById('imageInput').onchange = (e) => {
        const img = document.getElementById('preview');
        img.src = URL.createObjectURL(e.target.files[0]);
        img.style.display = 'inline-block';
        document.getElementById('resultGrid').style.display = 'none';
    };

    async function startAnalysis() {
        const img = document.getElementById('preview');
        const grid = document.getElementById('resultGrid');
        grid.style.display = 'grid';

        // Benchmark MobileNet
        const t0 = performance.now();
        const pMobile = await netMobile.classify(img);
        const t1 = performance.now();
        
        updateUI('m', pMobile[0], (t1 - t0).toFixed(0));

        // Benchmark ResNet
        const t2 = performance.now();
        const pResnet = await netResnet.classify(img);
        const t3 = performance.now();
        
        updateUI('r', pResnet[0], (t3 - t2).toFixed(0));
    }

    function updateUI(prefix, data, time) {
        document.getElementById(`${prefix}-label`).innerText = data.className.split(',')[0];
        document.getElementById(`${prefix}-prob`).innerText = `Confidence: ${(data.probability * 100).toFixed(1)}%`;
        document.getElementById(`${prefix}-time`).innerText = `Latency: ${time}ms`;
    }
</script>

</body>
</html>

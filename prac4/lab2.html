<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>AI Digit Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <style>
        :root { --accent: #00f2fe; --bg: #1a1a1e; --card: #25252b; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
        
        .main-card { background: var(--card); padding: 30px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid #333; }
        
        canvas { background: #000; border: 3px solid #444; border-radius: 15px; cursor: crosshair; touch-action: none; }
        
        .ui-row { display: flex; gap: 15px; margin-top: 20px; justify-content: center; }
        
        button { border: none; padding: 12px 25px; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-clear { background: #333; color: #ccc; }
        .btn-predict { background: var(--accent); color: #000; box-shadow: 0 0 15px rgba(0, 242, 254, 0.4); }
        button:hover { transform: scale(1.05); opacity: 0.9; }

        #result-display { font-size: 5rem; font-weight: 900; color: var(--accent); margin: 15px 0; text-shadow: 0 0 20px rgba(0, 242, 254, 0.5); }
        .label { text-transform: uppercase; font-size: 0.75rem; color: #888; letter-spacing: 2px; }
    </style>
</head>
<body>

    <h2 style="margin-bottom: 30px; letter-spacing: -1px;">Handwritten <span style="color:var(--accent)">Digit AI</span></h2>

    <div class="main-card">
        <canvas id="paintBox" width="280" height="280"></canvas>
        
        <div class="ui-row">
            <button class="btn-clear" onclick="resetCanvas()">Reset</button>
            <button class="btn-predict" onclick="runInference()">Analyze Digit</button>
        </div>

        <div style="text-align: center; margin-top: 30px; border-top: 1px solid #333; padding-top: 20px;">
            <div class="label">AI Prediction</div>
            <div id="result-display">?</div>
            <div id="confidence" style="color: #666; font-size: 0.9rem;">Ready for input...</div>
        </div>
    </div>

<script>
    const canvas = document.getElementById("paintBox");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const output = document.getElementById("result-display");
    const confText = document.getElementById("confidence");
    let model;

    // Drawing Style
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, 280, 280);
    ctx.lineWidth = 16;
    ctx.lineCap = "round";
    ctx.strokeStyle = "white";

    // Improved Drawing Logic
    let isDrawing = false;
    const startPos = (e) => { isDrawing = true; draw(e); };
    const endPos = () => { isDrawing = false; ctx.beginPath(); };

    function draw(e) {
        if (!isDrawing) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - rect.left;
        const y = (e.clientY || e.touches[0].clientY) - rect.top;
        
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
    }

    canvas.addEventListener("mousedown", startPos);
    canvas.addEventListener("mousemove", draw);
    window.addEventListener("mouseup", endPos);
    canvas.addEventListener("touchstart", (e) => { e.preventDefault(); startPos(e); });
    canvas.addEventListener("touchmove", (e) => { e.preventDefault(); draw(e); });

    function resetCanvas() {
        ctx.fillRect(0, 0, 280, 280);
        output.innerText = "?";
        confText.innerText = "Ready for input...";
    }

    async function initAI() {
        try {
            model = await tf.loadLayersModel('https://storage.googleapis.com/tfjs-models/tfjs/mnist/model.json');
            confText.innerText = "Model Active";
        } catch(e) { confText.innerText = "Load Error"; }
    }
    initAI();

    async function runInference() {
        if (!model) return;

        const predictionData = tf.tidy(() => {
            const input = tf.browser.fromPixels(canvas, 1)
                .resizeBilinear([28, 28])
                .toFloat()
                .div(255.0)
                .expandDims(0);
            
            const res = model.predict(input);
            return {
                digit: res.argMax(1).dataSync()[0],
                prob: res.max().dataSync()[0]
            };
        });

        output.innerText = predictionData.digit;
        confText.innerText = "Confidence: " + (predictionData.prob * 100).toFixed(1) + "%";
    }
</script>
</body>
</html>

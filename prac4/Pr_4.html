<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>AI Vision Studio</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
    <style>
        :root { --primary: #6366f1; --bg-gradient: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
        body { font-family: 'Inter', sans-serif; background: var(--bg-gradient); color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; margin: 0; }
        
        .container { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 40px; width: 100%; max-width: 600px; text-align: center; }
        
        #preview { width: 100%; max-height: 350px; object-fit: contain; border-radius: 16px; margin: 25px 0; display: none; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); }
        
        .custom-upload { background: var(--primary); color: white; padding: 12px 24px; border-radius: 12px; cursor: pointer; display: inline-block; font-weight: 600; transition: 0.3s; margin-bottom: 20px; }
        .custom-upload:hover { opacity: 0.9; transform: translateY(-2px); }

        .btn-analyze { background: #10b981; color: white; border: none; padding: 14px 30px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1rem; width: 100%; transition: 0.3s; }
        .btn-analyze:disabled { background: #4b5563; cursor: not-allowed; }

        .pred-card { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 12px; margin-top: 15px; text-align: left; }
        .bar-container { height: 8px; background: #374151; border-radius: 4px; margin-top: 8px; overflow: hidden; }
        .bar-fill { height: 100%; background: var(--primary); transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        
        #sys-status { font-size: 0.85rem; color: #94a3b8; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="margin-top: 0; letter-spacing: -1px;">Object <span style="color: var(--primary);">Intelligence</span></h2>
        
        <label class="custom-upload">
            <input type="file" id="imgInp" accept="image/*" style="display: none;">
            Choose Target Image
        </label>

        <img id="preview" />

        <button id="runBtn" class="btn-analyze" onclick="startVision()" disabled>Initializing AI...</button>
        <div id="sys-status">MobileNet is warming up...</div>

        <div id="results-wall" style="margin-top: 30px;"></div>
    </div>

<script>
    let visionCore;

    // Load AI Engine
    (async () => {
        try {
            visionCore = await mobilenet.load();
            document.getElementById('sys-status').innerText = "System Ready. Upload image to begin.";
            document.getElementById('runBtn').innerText = "Analyze Image";
            document.getElementById('runBtn').disabled = false;
        } catch (e) {
            document.getElementById('sys-status').innerText = "Engine Error. Refresh Page.";
        }
    })();

    // Image Handlers
    document.getElementById('imgInp').onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
            const viewer = document.getElementById('preview');
            viewer.src = URL.createObjectURL(file);
            viewer.style.display = 'block';
            document.getElementById('results-wall').innerHTML = "";
        }
    };

    async function startVision() {
        const target = document.getElementById('preview');
        const btn = document.getElementById('runBtn');
        const wall = document.getElementById('results-wall');

        if (!target.src) {
            alert("Upload an image first.");
            return;
        }

        btn.disabled = true;
        btn.innerText = "Analyzing Patterns...";
        wall.innerHTML = "";

        const inferences = await visionCore.classify(target);

        inferences.forEach(data => {
            const percent = (data.probability * 100).toFixed(1);
            const card = `
                <div class="pred-card">
                    <div style="display: flex; justify-content: space-between;">
                        <span style="font-weight: 600;">${data.className.split(',')[0]}</span>
                        <span style="color: #94a3b8;">${percent}%</span>
                    </div>
                    <div class="bar-container">
                        <div class="bar-fill" style="width: ${percent}%"></div>
                    </div>
                </div>
            `;
            wall.insertAdjacentHTML('beforeend', card);
        });

        btn.disabled = false;
        btn.innerText = "Analyze Again";
    }
</script>

</body>
</html>

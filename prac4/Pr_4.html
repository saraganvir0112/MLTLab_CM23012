<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MobileNet Browser Classifier</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
    
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background: #f4f4f9; }
        #image-container { margin: 20px 0; border: 2px solid #ddd; padding: 10px; background: white; border-radius: 8px; }
        img { max-width: 300px; display: block; }
        .result-item { list-style: none; margin: 10px 0; padding: 10px; background: #e0f7fa; border-radius: 4px; border-left: 5px solid #00acc1; }
        #status { font-weight: bold; color: #555; }
    </style>
</head>
<body>

    <h2>MobileNet Image Classification</h2>
    <p id="status">Status: Loading Model...</p>

    <input type="file" id="file-upload" accept="image/*" disabled>
    
    <div id="image-container">
        <img id="img" crossorigin="anonymous" src="https://images.dog.ceo/breeds/retriever-golden/n02099601_3004.jpg" />
    </div>

    <div id="predictions"></div>

    <script>
        const img = document.getElementById('img');
        const status = document.getElementById('status');
        const predictionsDiv = document.getElementById('predictions');
        const fileUpload = document.getElementById('file-upload');
        let model;

        // Initialize and Load Model
        async function init() {
            model = await mobilenet.load();
            status.innerText = "Status: Model Ready! Upload an image or use the default.";
            fileUpload.disabled = false;
            classifyImage();
        }

        // The Core Classification Logic
        async function classifyImage() {
            predictionsDiv.innerHTML = "Classifying...";
            const results = await model.classify(img);
            
            predictionsDiv.innerHTML = "";
            results.forEach(p => {
                const div = document.createElement('div');
                div.className = "result-item";
                div.innerHTML = `<strong>${p.className}</strong>: ${(p.probability * 100).toFixed(2)}%`;
                predictionsDiv.appendChild(div);
            });
        }

        // Handle File Uploads
        fileUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                img.src = event.target.result;
                // Wait for the image to load in the DOM before classifying
                img.onload = () => classifyImage();
            };
            reader.readAsDataURL(file);
        });

        init();
    </script>
</body>
</html>
